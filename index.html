<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GASG Podcast</title>
<style>
:root {
  --bg: #1c1b19;
  --surface: #252422;
  --border: #393836;
  --text: #cdccca;
  --text-muted: #797876;
  --accent: #4f98a3;
  --font: 'Inter', -apple-system, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  padding:32px 16px;
}
.container{max-width:640px;margin:0 auto;}
h1{font-size:22px;font-weight:700;margin-bottom:6px;}
.desc{font-size:13px;color:var(--text-muted);margin-bottom:28px;}
.episode{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px 20px;
  margin-bottom:16px;
}
.ep-title{font-size:15px;font-weight:600;margin-bottom:4px;}
.ep-meta{font-size:12px;color:var(--text-muted);margin-bottom:12px;}
.ep-player iframe{
  width:100%;height:160px;
  border:none;
  border-radius:8px;
  overflow:hidden;
}
.embed-code{margin-top:10px;}
.embed-code summary{font-size:11px;color:var(--accent);cursor:pointer;}
.embed-code pre{
  margin-top:6px;
  background:#111;
  border:1px solid var(--border);
  border-radius:6px;
  padding:10px;
  font-size:11px;
  overflow-x:auto;
  white-space:pre-wrap;
  word-break:break-all;
  color:#9cdcfe;
  user-select:all;
}
.copy-btn{
  margin-top:6px;
  font-size:11px;
  padding:4px 10px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.copy-btn:hover{opacity:0.85;}
</style>
</head>
<body>
<div class="container">
  <h1>🎙️ GASG Podcast</h1>
  <p class="desc">エピソード一覧 - 各エピソードのプレイヤーを外部サイトに埋め込めます</p>
  <div id="episodes"></div>
</div>
<script>
const BASE = location.origin + location.pathname.replace('index.html','');
const PLAYER = BASE + 'embed-player.html';

const episodes = [
  {
    title: 'AI時代の優位性をつくる小さいコミュニティ',
    date: '2026-04-16',
    track: 'music/ep01.mp3',
    subtitle: 'GASG 2025年度活動振り返りと2026年度の展望'
  },
  {
    title: 'AIと法務の現在地――規制・活用・ガバナンス',
    date: '2026-04-14',
    track: 'music/ep02.mp3',
    subtitle: 'Generative AI Study Group第70回'
  },
  {
    title: '「エージェントエンジニアリング」とは？ 自身と AI の働き方',
    date: '2026-05-12',
    track: 'music/ep03.mp3',
    subtitle: 'Generative AI Study Group第71回'
  },
  {
    title: 'AIで地域観光を変える！『データ分析×生成AI』のリアルな活用',
    date: '2026-05-12',
    track: 'music/ep04.mp3',
    subtitle: 'Generative AI Study Group第72回'
  },
  {
    title: 'AI駆動開発の新しい構造 - Spec-Driven Development が示すこれからの設計思想',
    date: '2026-05-26',
    track: 'music/ep05.mp3',
    subtitle: 'Generative AI Study Group第73回'
  },
  {
    title: '[x]clawとはいったいなんだったのか？ Openclawに始まったclaw系ムーブメントの現在地とこれから',
    date: '2026-06-09',
    track: 'music/ep06.mp3',
    subtitle: 'Generative AI Study Group第74回'
  },
  {
    title: '高校生が開発した「先生AI」による足場かけ - RAGを用いた英文和訳学習アプリの開発事例紹介',
    date: '2026-06-24',
    track: 'music/ep07.mp3',
    subtitle: 'Generative AI Study Group第75回'
  },
  {
    title: '部活動で活用するAIコーチングアプリ「RUN-TREE」～練習日誌の振り返りと「成長の木」で生徒と指導者の課題を解決する～',
    date: '2026-07-28',
    track: 'music/ep08.mp3',
    subtitle: 'Generative AI Study Group第77回'
  }
];

const container = document.getElementById('episodes');

episodes.forEach((ep, idx) => {
  const params = new URLSearchParams({
    track: BASE + ep.track,
    title: ep.title,
    subtitle: ep.subtitle
  });
  const iframeSrc = PLAYER + '?' + params.toString();
  const embedCode = '<iframe src="' + iframeSrc + '" width="100%" height="160" frameborder="0" style="border-radius:12px;display:block;"></iframe>';

  const div = document.createElement('div');
  div.className = 'episode';

  const preId = 'pre-' + idx;
  const btnId = 'btn-' + idx;

  div.innerHTML =
    '<div class="ep-title">' + ep.title + '</div>' +
    '<div class="ep-meta">' + ep.date + ' &nbsp;|&nbsp; ' + ep.subtitle + '</div>' +
    '<div class="ep-player"><iframe src="' + iframeSrc + '" height="160" frameborder="0" loading="lazy"></iframe></div>' +
    '<details class="embed-code">' +
      '<summary>埋め込みコードを表示</summary>' +
      '<pre id="' + preId + '"></pre>' +
      '<button class="copy-btn" id="' + btnId + '">コードをコピー</button>' +
    '</details>';

  container.appendChild(div);

  // preタグにテキストとして安全にセット
  document.getElementById(preId).textContent = embedCode;

  // コピーボタン
  document.getElementById(btnId).addEventListener('click', function() {
    navigator.clipboard.writeText(embedCode)
      .then(() => { this.textContent = 'コピーしました！'; setTimeout(() => { this.textContent = 'コードをコピー'; }, 2000); })
      .catch(() => { this.textContent = '手動でコピーしてください'; });
  });
});
</script>
</body>
</html>
